<ngx-spinner
  bdColor="rgba(15, 23, 42, 0.75)"
  size="large"
  color="#6d4bd8"
  type="ball-scale-multiple"
  [fullScreen]="true">
  <p class="text-sm font-semibold text-amber-300">Ingresando...</p>
</ngx-spinner>

<form class="space-y-4" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="space-y-3">
    <div class="mx-auto flex h-11 w-11 items-center justify-center rounded-2xl bg-primary/10 text-primary ring-1 ring-primary/15">
      <svg-icon src="assets/icons/heroicons/outline/shield-check.svg" [svgClass]="'h-6 w-6'"></svg-icon>
    </div>

    <div class="space-y-1 text-center">
      <h2 class="text-xl font-black leading-tight text-slate-950">Inicia sesión</h2>
    </div>

  </div>

  <div class="space-y-3 text-left">
    <div class="space-y-1.5">
      <label for="email" class="login-label">Usuario o correo</label>
      <div class="relative">
        <span class="input-icon">
          <svg-icon src="assets/icons/heroicons/outline/user-circle.svg" [svgClass]="'h-4 w-4'"></svg-icon>
        </span>
        <input
          type="text"
          id="email"
          [ngClass]="{ 'is__invalid-input': submitted && f['email'].errors }"
          class="login-input"
          placeholder="usuario@empresa.com"
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="submitted && f['email'].errors ? true : null" />
      </div>
      <div *ngIf="submitted && f['email'].errors" class="is__invalid-error">
        <div *ngIf="f['email'].errors['required']">Campo obligatorio</div>
      </div>
    </div>

    <div class="space-y-1.5">
      <label for="password" class="login-label">Contraseña</label>
      <div class="relative">
        <span class="input-icon">
          <svg-icon src="assets/icons/heroicons/outline/lock-closed.svg" [svgClass]="'h-4 w-4'"></svg-icon>
        </span>
        <input
          [type]="passwordTextType ? 'text' : 'password'"
          id="password"
          [ngClass]="{ 'is__invalid-input': submitted && f['password'].errors }"
          class="login-input pr-10"
          placeholder="Tu contraseña"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="submitted && f['password'].errors ? true : null" />
        <button
          type="button"
          class="absolute right-2 top-1/2 -translate-y-1/2 rounded-md p-1.5 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"
          (click)="togglePasswordTextType()"
          aria-label="Mostrar u ocultar contraseña">
          <svg-icon
            [src]="
              !passwordTextType
                ? 'assets/icons/heroicons/outline/eye-off.svg'
                : 'assets/icons/heroicons/outline/eye.svg'
            "
            [svgClass]="'h-4 w-4'">
          </svg-icon>
        </button>
      </div>
      <div *ngIf="submitted && f['password'].errors" class="is__invalid-error">
        <div *ngIf="f['password'].errors['required']">Campo obligatorio</div>
      </div>
    </div>
  </div>

  <div
    *ngIf="submitted && form.invalid"
    class="rounded-xl border border-destructive/20 bg-destructive/5 px-3 py-2 text-xs font-semibold text-destructive">
    Verifica usuario y contraseña para continuar.
  </div>

  <div class="space-y-3 pt-1">
    <app-button full impact="bold" tone="primary" shape="rounded" size="medium" shadow="small" [disabled]="isSubmitting">
      <span class="flex items-center justify-center gap-2">
        <svg-icon
          *ngIf="!isSubmitting"
          src="assets/icons/heroicons/outline/arrow-long-right.svg"
          [svgClass]="'h-4 w-4'">
        </svg-icon>
        {{ isSubmitting ? 'Validando acceso...' : 'Entrar al sistema' }}
      </span>
    </app-button>

    <div class="flex items-center justify-center gap-1 text-xs text-slate-500">
      <span>¿No tienes una cuenta?</span>
      <a routerLink="/register-company" class="font-bold text-primary transition hover:text-primary/80">Regístrate</a>
    </div>
  </div>
</form>
