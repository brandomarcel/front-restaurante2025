<div *ngIf="!ready" class="min-h-full bg-muted/70 p-3 lg:p-4">
  <div class="mb-3 h-28 animate-pulse rounded-xl bg-card"></div>
  <div class="grid grid-cols-2 gap-2 xl:grid-cols-4">
    <div *ngFor="let i of [1, 2, 3, 4]" class="h-20 animate-pulse rounded-xl border border-border bg-card"></div>
  </div>
</div>

<div *ngIf="ready && layout.view !== 'none' && layout.view !== 'kitchen'" class="min-h-full bg-muted/70 p-3 lg:p-4">
  <app-dashboard-hero
    [businessName]="businessName"
    [logo]="logo"
    [modeLabel]="hero.modeLabel"
    [title]="hero.title"
    [subtitle]="hero.subtitle"
    [gradientClasses]="hero.gradient"
    [userName]="userName"
    [signature]="layout.view === 'service' ? null : signature"
    [cashOpen]="heroCashOpen"
    [plan]="layout.view === 'service' ? null : plan">
  </app-dashboard-hero>

  <app-avisos [avisos]="avisos" (eliminar)="removeAlert($event)" class="mb-3 block"></app-avisos>

  <app-plan-usage-card *ngIf="showPlanCard" [plan]="plan"></app-plan-usage-card>

  <ng-container [ngSwitch]="layout.view">
    <ng-container *ngSwitchCase="'operations'">
      <section *ngIf="layout.billingSummary && liteDashboard" class="mb-1">
        <div class="mb-2 flex items-center justify-between gap-2 px-1">
          <h2 class="text-sm font-bold text-foreground">Comprobantes electrónicos del mes</h2>
          <a routerLink="/dashboard/invoices" class="text-[11px] font-semibold text-primary">Ver facturas</a>
        </div>
        <app-billing-kpis [sales]="liteDashboard.sales"></app-billing-kpis>
      </section>

      <app-operations-panel
        [metrics]="operationsMetrics"
        [loading]="operationsLoading"
        [error]="operationsError"
        [needsTerminal]="needsTerminal"
        [showCash]="showCash"
        [signature]="signature"
        [cashierExperience]="cashierExperience"
        [retailStock]="retailStock">
      </app-operations-panel>
    </ng-container>

    <app-service-panel *ngSwitchCase="'service'"></app-service-panel>

    <ng-container *ngSwitchDefault>

      <div *ngIf="liteLoading && !liteDashboard" class="mb-3 rounded-xl border border-border bg-card p-6 text-center text-xs font-semibold text-muted-foreground shadow-sm">
        Cargando información…
      </div>

      <ng-container *ngIf="liteDashboard">
        <app-billing-panel *ngIf="layout.view === 'billing'"
          [dashboard]="liteDashboard"
          [plan]="plan"
          [inventoryEnabled]="capabilities.isEnabled('inventory')">
        </app-billing-panel>
        <app-api-panel *ngIf="layout.view === 'api'"
          [dashboard]="liteDashboard"
          [plan]="plan"
          [company]="company">
        </app-api-panel>
      </ng-container>
    </ng-container>
  </ng-container>
</div>

<div *ngIf="ready && layout.view === 'none'" class="flex min-h-full items-center justify-center bg-muted/70 p-6">
  <div class="max-w-sm rounded-xl border border-border bg-card p-6 text-center shadow-sm">
    <h2 class="text-sm font-bold text-foreground">Sin panel disponible</h2>
    <p class="mt-1 text-xs text-muted-foreground">Tu rol no tiene un panel principal asignado en este negocio. Usa el menú lateral para acceder a los módulos habilitados.</p>
  </div>
</div>
