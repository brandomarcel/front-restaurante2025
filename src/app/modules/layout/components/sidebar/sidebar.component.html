<nav
  [ngClass]="menuService.showSideBar ? 'w-[218px] 2xl:w-[238px] min-w-[218px] 2xl:min-w-[238px]' : 'w-[62px] min-w-[62px]'"
  class="hidden h-full min-h-0 flex-col justify-between overflow-x-hidden border-r border-border bg-card pt-2 transition-[width] duration-300 motion-reduce:transition-none xl:flex"
  role="navigation"
  aria-label="Sidebar"
>
  <div class="overflow-hidden min-h-0 h-full flex flex-col">
    <!-- Marca: logo completo con el menú abierto; solo el símbolo (que expande) con el menú contraído. -->
    <div
      [ngClass]="menuService.showSideBar ? 'justify-between pl-2.5 pr-1' : 'justify-center'"
      class="mx-3 mb-3 mt-1 flex h-10 shrink-0 items-center"
    >
      <ng-container *ngIf="menuService.showSideBar; else collapsedBrand">
        <ng-container *ngTemplateOutlet="brandLogo"></ng-container>
        <button
          type="button"
          (click)="toggleSidebar()"
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-muted-foreground/60 transition-colors hover:bg-muted hover:text-foreground focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
          aria-expanded="true"
          aria-controls="sidebar-menu"
          aria-label="Contraer menú"
          title="Contraer menú"
        >
          <svg-icon src="assets/icons/heroicons/solid/chevron-double-left.svg" [svgClass]="'h-4 w-4'"></svg-icon>
        </button>
      </ng-container>

      <ng-template #collapsedBrand>
        <button
          type="button"
          (click)="toggleSidebar()"
          class="flex h-10 w-10 items-center justify-center rounded-lg transition-colors hover:bg-muted focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
          aria-expanded="false"
          aria-controls="sidebar-menu"
          aria-label="Expandir menú"
          title="Expandir menú"
        >
          <img src="assets/brand/facturada-simbolo-color.svg" alt="" class="h-7 w-7 dark:hidden" />
          <img src="assets/brand/facturada-simbolo-sobre-oscuro.svg" alt="" class="hidden h-7 w-7 dark:block" />
        </button>
      </ng-template>
    </div>

    <div
      id="sidebar-menu"
      class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden px-3 scrollbar-thin scrollbar-thumb-muted-foreground/40 scrollbar-track-transparent hover:scrollbar-thumb-muted-foreground/60"
    >
      <app-sidebar-menu></app-sidebar-menu>
    </div>
  </div>

  <p
    class="mx-3 my-3 shrink-0 px-2.5 text-[11px] text-muted-foreground/60"
    [ngClass]="{ 'text-center !px-0': !menuService.showSideBar }"
    [attr.title]="'FacturADA v' + appJson.version"
  >v{{ appJson.version }}</p>
</nav>

<div *ngIf="menuService.showMobileMenu" class="fixed inset-0 z-[100] xl:hidden" aria-modal="true" role="dialog">
  <button
    type="button"
    class="absolute inset-0 bg-black/45"
    (click)="closeMobileMenu()"
    aria-label="Cerrar menu lateral"
  ></button>

  <nav id="sidebar-mobile-menu" class="bg-card absolute inset-y-0 left-0 flex w-[260px] max-w-[85vw] flex-col pt-2 shadow-2xl">
    <div class="mx-3 mb-3 mt-1 flex h-10 shrink-0 items-center justify-between pl-2.5 pr-1">
      <ng-container *ngTemplateOutlet="brandLogo"></ng-container>

      <button
        type="button"
        (click)="closeMobileMenu()"
        class="text-muted-foreground/60 hover:text-muted-foreground flex h-8 w-8 items-center justify-center rounded-md p-1.5 focus:outline-none focus:ring-2 focus:ring-primary/50"
        aria-label="Cerrar menú"
      >
        <svg-icon src="assets/icons/heroicons/outline/x.svg"></svg-icon>
      </button>
    </div>

    <div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden px-3 scrollbar-thin scrollbar-thumb-muted-foreground/40 scrollbar-track-transparent hover:scrollbar-thumb-muted-foreground/60">
      <app-sidebar-menu [mobile]="true"></app-sidebar-menu>
    </div>

    <p class="mx-3 my-3 shrink-0 px-2.5 text-[11px] text-muted-foreground/60">FacturADA v{{ appJson.version }}</p>
  </nav>
</div>

<!-- Marca del producto en su versión para el tema. La identidad del negocio va en la barra
     superior (perfil) y en el Dashboard: un logo subido como foto no se lee a este tamaño. -->
<ng-template #brandLogo>
  <img src="assets/brand/facturada-logo-principal.svg" alt="FacturADA" class="h-[22px] w-auto dark:hidden" />
  <img src="assets/brand/facturada-logo-sobre-oscuro.svg" alt="FacturADA" class="hidden h-[22px] w-auto dark:block" />
</ng-template>
