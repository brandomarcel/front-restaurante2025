<div
  class="max-h-0 overflow-hidden pt-0.5 transition-all duration-300 motion-reduce:transition-none ltr:pl-[21px] rtl:pr-[21px]"
  [ngClass]="{ hidden: !mobile && !menuService.showSideBar, 'max-h-screen': submenu.expanded }">
  <ul
    class="border-border flex flex-col gap-0.5 ltr:border-l ltr:pl-2 rtl:border-r rtl:pr-2">
    <li *ngFor="let sub of submenu.children">
      <div class="relative flex" [ngClass]="sub.active ? 'text-primary' : 'text-foreground/70 hover:text-foreground'" (click)="toggleMenu(sub)">
        <!-- Condition -->
        <ng-container
          [ngTemplateOutlet]="sub.children ? childMenu : parentMenu"
          [ngTemplateOutletContext]="{ sub: sub }">
        </ng-container>

        <!-- Parent Menu -->
        <ng-template #parentMenu let-sub="sub">
          <a
            (click)="closeMobileMenu()"
            [routerLink]="sub.route"
            [attr.aria-current]="sub.active ? 'page' : null"
            class="inline-block w-full rounded-md px-3 py-1.5 text-[12.5px] hover:bg-muted/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
            [ngClass]="{ 'font-semibold': sub.active, 'font-medium': !sub.active }">
            {{ sub.label }}
          </a>
          @if(sub.active){
          <span
            class="size-1.5 bg-primary absolute flex translate-y-3 items-center rounded-full ltr:-translate-x-[11.5px] rtl:translate-x-[11.5px]">
          </span>
          }
        </ng-template>

        <!-- Child Menu -->
        <ng-template #childMenu let-sub="sub">
          <a class="inline-block w-full cursor-pointer px-3 py-1.5 text-[12.5px] font-medium">
            {{ sub.label }}
          </a>
          <button
            [ngClass]="{ hidden: !mobile && !menuService.showSideBar }"
            class="text-foreground/50 flex cursor-pointer items-center justify-end px-1.5 transition-all duration-500">
            @if(!sub.expanded){
            <svg-icon src="assets/icons/heroicons/outline/plus.svg" svgClass="h-4 w-4"> </svg-icon>
            }@else {
            <svg-icon src="assets/icons/heroicons/outline/minus.svg" svgClass="h-4 w-4"> </svg-icon>
            }
          </button>
        </ng-template>
      </div>
      <!-- Submenu items -->
      @if(sub.children?.length){
      <app-sidebar-submenu [submenu]="sub" [mobile]="mobile"></app-sidebar-submenu>
      }
    </li>
  </ul>
</div>
