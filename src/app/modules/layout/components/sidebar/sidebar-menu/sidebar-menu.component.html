<div class="space-y-2">
  <div *ngFor="let menu of menuService.pagesMenu" class="space-y-0.5">
    <div *ngIf="menuService.showSideBar || mobile" class="px-2 pt-1">
      <small class="text-muted-foreground/55 text-[9px] font-semibold uppercase tracking-[0.12em]">
        {{ menu.group }}
      </small>
    </div>

    <ul class="flex flex-col gap-0.5 text-[11px]">
      <li *ngFor="let item of menu.items">
        <div
          (click)="onItemClick(item)"
          (keydown)="onItemKeydown($event, item)"
          [attr.role]="item.children ? 'button' : 'link'"
          [attr.title]="!mobile && !menuService.showSideBar ? item.label : null"
          tabindex="0"
          [ngClass]="{
            'bg-primary/10 text-primary shadow-sm ring-1 ring-primary/10': item.active || item.expanded,
            'text-muted-foreground hover:bg-slate-50 hover:text-foreground': !(item.active || item.expanded),
            'justify-center px-0': !mobile && !menuService.showSideBar
          }"
          class="group relative flex min-h-[34px] items-center gap-2 rounded-lg px-2.5 py-1.5 transition-all duration-200"
        >
          <span
            [ngClass]="(item.active || item.expanded) ? 'text-primary' : 'text-muted-foreground/60 group-hover:text-foreground'"
            class="inline-flex shrink-0 items-center justify-center"
          >
            <svg-icon [src]="item.icon || ''" [svgClass]="'h-4 w-4'"></svg-icon>
          </span>

          <ng-container
            [ngTemplateOutlet]="item.children ? childMenu : parentMenu"
            [ngTemplateOutletContext]="{ item: item }"
          ></ng-container>

          <button
            *ngIf="item.children && (menuService.showSideBar || mobile)"
            class="ml-auto inline-flex items-center justify-center text-muted-foreground/70 transition-transform duration-200"
            [ngClass]="{ 'rotate-90': item.expanded }"
            aria-label="Expandir submenu"
            type="button"
          >
            <svg-icon src="assets/icons/heroicons/solid/chevron-right.svg" svgClass="h-3.5 w-3.5"></svg-icon>
          </button>

        </div>

        <app-sidebar-submenu [submenu]="item" [mobile]="mobile"></app-sidebar-submenu>
      </li>
    </ul>

    <div class="py-1.5" *ngIf="menu.separator">
      <hr class="border-muted-foreground/20 border-dashed" />
    </div>
  </div>

  <ng-template #parentMenu let-item="item">
    <span
      [ngClass]="{ hidden: !mobile && !menuService.showSideBar }"
      class="flex grow items-center truncate text-[11px] font-semibold"
    >
      {{ item.label }}
    </span>
  </ng-template>

  <ng-template #childMenu let-item="item">
    <span
      [ngClass]="{ hidden: !mobile && !menuService.showSideBar }"
      class="flex grow items-center truncate text-[11px] font-semibold"
    >
      {{ item.label }}
    </span>
  </ng-template>
</div>
