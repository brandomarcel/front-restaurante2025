<!-- Pestañas de estado: una por grupo con su conteo (misma búsqueda y fechas) -->
<div *ngIf="tabs.length" class="flex overflow-x-auto border-b border-border px-1 [scrollbar-width:none]" role="group" [attr.aria-label]="tabsLabel">
  <button *ngFor="let tab of tabs" type="button" (click)="selectStatus(tab.value)" [title]="tab.hint || tab.label"
    [attr.aria-pressed]="status === tab.value"
    class="relative -mb-px inline-flex shrink-0 items-center gap-2 border-b-2 px-3 py-2.5 text-[13px] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary/40"
    [ngClass]="status === tab.value
      ? 'border-primary font-semibold text-foreground'
      : 'border-transparent font-medium text-muted-foreground hover:text-foreground'">
    <span *ngIf="tab.dot" class="h-2 w-2 shrink-0 rounded-full" [ngClass]="tab.dot" aria-hidden="true"></span>
    <ng-container *ngIf="tab.shortLabel && tab.shortLabel !== tab.label; else fullLabel">
      <span class="hidden sm:inline">{{ tab.label }}</span><span class="sm:hidden">{{ tab.shortLabel }}</span>
    </ng-container>
    <ng-template #fullLabel>{{ tab.label }}</ng-template>
    <span *ngIf="countFor(tab) !== null"
      class="min-w-[1.5rem] rounded-full px-1.5 py-0.5 text-center text-[11px] font-semibold tabular-nums"
      [ngClass]="pillClass(tab, countFor(tab) ?? 0)">{{ countFor(tab) }}</span>
  </button>
</div>

<!-- Búsqueda, controles propios de la pantalla, fecha y limpiar -->
<div class="flex flex-wrap items-center gap-2 border-b border-border bg-muted/30 px-3 py-2.5 lg:flex-nowrap">
  <div class="relative min-w-[220px] flex-1">
    <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
    </svg>
    <input class="input h-9 w-full !pl-9" type="search" [ngModel]="search" (ngModelChange)="searchChange.emit($event)"
      [attr.aria-label]="searchLabel" [placeholder]="searchPlaceholder" autocomplete="off" />
  </div>

  <ng-content></ng-content>

  <ng-container *ngIf="showDates">
    <div class="relative min-w-[150px] flex-1 sm:flex-none">
      <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path>
      </svg>
      <select class="input h-9 w-full !pl-9 sm:min-w-[175px]" [ngModel]="dateMode" (ngModelChange)="onDateModeChange($event)"
        [attr.aria-label]="dateLabel">
        <option *ngFor="let option of dateOptions" [ngValue]="option.value">{{ option.label }}</option>
      </select>
    </div>

    <!-- Una regla global sin capa fija `width: 100%` en los campos de fecha: por eso `sm:!w-[140px]`. -->
    <div *ngIf="dateMode === 'custom'" class="order-last flex w-full items-center gap-1.5 sm:order-none sm:w-auto">
      <input class="input h-9 min-w-0 flex-1 sm:!w-[140px] sm:flex-none" type="date" [(ngModel)]="draftFrom" (ngModelChange)="onCustomDateChange()"
        [max]="draftTo || null" aria-label="Desde" [attr.aria-invalid]="!!dateError" />
      <span class="text-xs text-muted-foreground" aria-hidden="true">a</span>
      <input class="input h-9 min-w-0 flex-1 sm:!w-[140px] sm:flex-none" type="date" [(ngModel)]="draftTo" (ngModelChange)="onCustomDateChange()"
        [min]="draftFrom || null" aria-label="Hasta" [attr.aria-invalid]="!!dateError" />
    </div>
  </ng-container>

  <button *ngIf="hasActiveFilters" type="button" (click)="clear.emit()"
    class="inline-flex h-9 shrink-0 items-center gap-1.5 whitespace-nowrap rounded-md px-2.5 text-xs font-semibold text-muted-foreground transition-colors hover:bg-muted hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12"></path>
    </svg>
    Limpiar filtros
  </button>
</div>
<p *ngIf="dateError" class="border-b border-border px-3 py-1.5 text-xs text-danger-600" role="alert">{{ dateError }}</p>
