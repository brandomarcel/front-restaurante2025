<div class="app-container density-compact space-y-3 pb-6">
  <section class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4">
    <a
      *ngFor="let report of visibleReports; trackBy: trackByReport"
      [routerLink]="report.route"
      class="group rounded-2xl border border-border bg-card p-4 shadow-sm transition hover:-translate-y-0.5 hover:border-primary/40 hover:shadow-md">
      <div class="mb-4 flex items-center justify-between gap-3">
        <span class="rounded-full bg-muted px-2.5 py-1 text-[10px] font-black uppercase tracking-wide text-muted-foreground">
          {{ report.badge }}
        </span>
        <span class="h-9 w-9 rounded-xl bg-gradient-to-r shadow-sm" [ngClass]="report.accent"></span>
      </div>

      <h2 class="text-base font-black text-foreground">{{ report.title }}</h2>
      <p class="mt-1 min-h-[34px] text-xs leading-5 text-muted-foreground">{{ report.description }}</p>

      <div class="mt-4 flex items-center justify-between border-t border-border pt-3">
        <span class="text-[11px] font-bold uppercase tracking-wide text-primary">Abrir reporte</span>
        <span class="rounded-full bg-primary/10 px-2 py-1 text-xs font-black text-primary transition group-hover:bg-primary group-hover:text-white">
          →
        </span>
      </div>
    </a>
  </section>

  <section *ngIf="visibleReports.length === 0" class="rounded-2xl border border-amber-200 bg-amber-50 p-6 text-center">
    <h2 class="text-sm font-bold text-amber-900">No hay reportes disponibles</h2>
    <p class="mt-1 text-xs text-amber-800">Tu usuario no tiene permisos para consultar reportes o las funciones no están habilitadas para esta empresa.</p>
  </section>
</div>
