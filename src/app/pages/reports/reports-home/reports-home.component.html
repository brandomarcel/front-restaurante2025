<div class="app-container density-compact space-y-3 pb-6">
  <section class="rounded-xl border border-border bg-white p-4 shadow-sm">
    <p class="text-[10px] font-bold uppercase tracking-wide text-primary">Reportes</p>
    <h1 class="text-xl font-black text-slate-900">Centro de reportes</h1>
    <p class="mt-1 max-w-2xl text-xs text-muted-foreground">
      Elige el reporte que necesitas. Cada opción abre una pantalla dedicada para aprovechar todo el espacio con filtros y tabla.
    </p>
  </section>

  <section class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4">
    <a
      *ngFor="let report of visibleReports; trackBy: trackByReport"
      [routerLink]="report.route"
      class="group rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:border-primary/40 hover:shadow-md">
      <div class="mb-4 flex items-center justify-between gap-3">
        <span class="rounded-full bg-slate-100 px-2.5 py-1 text-[10px] font-black uppercase tracking-wide text-slate-600">
          {{ report.badge }}
        </span>
        <span class="h-9 w-9 rounded-xl bg-gradient-to-r shadow-sm" [ngClass]="report.accent"></span>
      </div>

      <h2 class="text-base font-black text-slate-900">{{ report.title }}</h2>
      <p class="mt-1 min-h-[34px] text-xs leading-5 text-muted-foreground">{{ report.description }}</p>

      <div class="mt-4 flex items-center justify-between border-t border-slate-100 pt-3">
        <span class="text-[11px] font-bold uppercase tracking-wide text-primary">Abrir reporte</span>
        <span class="rounded-full bg-primary/10 px-2 py-1 text-xs font-black text-primary transition group-hover:bg-primary group-hover:text-white">
          →
        </span>
      </div>
    </a>
  </section>
</div>
