<section class="overflow-hidden rounded-xl border border-border bg-card shadow-sm">
  <table class="w-full text-sm">
    <thead class="border-b border-border bg-muted/50 text-left text-xs font-semibold text-muted-foreground">
      <tr>
        <th scope="col" class="px-3 py-2.5">Pedido</th>
        <th scope="col" class="px-3 py-2.5">Estado</th>
        <th scope="col" class="px-3 py-2.5">Espera</th>
        <th scope="col" class="px-3 py-2.5">Factura</th>
        <th scope="col" class="px-3 py-2.5 text-right">Total</th>
        <th scope="col" class="px-3 py-2.5 text-right"><span class="sr-only">Acciones</span></th>
      </tr>
    </thead>

    <tbody class="divide-y divide-border">
      <tr *ngFor="let o of orders; trackBy: trackByName"
        class="cursor-pointer transition hover:bg-muted/40"
        [ngClass]="{ 'bg-info-500/5': o._flashType === 'insert' }"
        (click)="open.emit(o)">
        <td class="px-3 py-2.5">
          <p class="font-bold text-foreground">{{ headline(o) }}</p>
          <p class="mt-0.5 flex flex-wrap items-center gap-1.5 text-xs text-muted-foreground">
            <span *ngIf="typeLabel(o)" class="type-chip">{{ typeLabel(o) }}</span>
            <span>Orden {{ o.name }}</span>
          </p>
        </td>

        <td class="px-3 py-2.5">
          <span class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-bold" [ngClass]="stageBadge[stage(o)]">
            {{ stageLabel[stage(o)] }}
          </span>
        </td>

        <td class="px-3 py-2.5 whitespace-nowrap">
          <span *ngIf="isActive(o); else hour" class="font-bold" [ngClass]="waitClass(o)">{{ wait(o) }}</span>
          <ng-template #hour><span class="text-muted-foreground">{{ (o.createdAtISO || o.createdAt) | date:'HH:mm' }}</span></ng-template>
        </td>

        <td class="px-3 py-2.5">
          <span class="inline-flex rounded-full px-2 py-0.5 text-xs font-semibold" [ngClass]="getSriBadge(o.sri.status)">
            {{ o.sri.status || 'Sin factura' }}
          </span>
        </td>

        <td class="px-3 py-2.5 text-right font-black tabular-nums text-foreground">{{ o.total | currency:'USD':'symbol':'1.2-2' }}</td>

        <td class="px-3 py-2.5" (click)="$event.stopPropagation()">
          <div class="flex items-center justify-end gap-1.5">
            <ng-container *ngIf="allowActions; else detailOnly">
              <button *ngIf="isActive(o)" type="button" class="icon-action" (click)="printComanda.emit(o)"
                [attr.aria-label]="'Imprimir comanda de ' + headline(o)" title="Imprimir comanda">
                <fa-icon [icon]="['fas', 'print']"></fa-icon>
              </button>
              <button *ngIf="kitchenEnabled && isActive(o)" type="button" class="action-btn border border-border bg-card text-foreground hover:bg-muted"
                [disabled]="isPending(o)" (click)="emitNext(o)">
                {{ isPending(o) ? 'Actualizando…' : nextAction(o) }}
              </button>
              <button *ngIf="stage(o) !== 'cancelled'" type="button" class="action-btn"
                [ngClass]="invoiced(o) ? 'border border-border bg-card text-foreground hover:bg-muted' : 'bg-primary text-primary-foreground hover:bg-primary/90'"
                (click)="goOrder.emit(o)">
                {{ invoiced(o) ? 'Ver orden' : 'Cobrar' }}
              </button>
            </ng-container>
            <ng-template #detailOnly>
              <button type="button" class="action-btn border border-border bg-card text-foreground hover:bg-muted" (click)="open.emit(o)">Ver</button>
            </ng-template>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</section>
