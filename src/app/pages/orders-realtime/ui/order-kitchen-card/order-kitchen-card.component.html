<article class="kds-card" [ngClass]="['is-' + kitchenStage, isDelayed ? 'is-late' : '', isNewOrder ? 'is-fresh' : '']">
  <!-- Encabezado: a quién va (mesa/alias), número y tiempo -->
  <header class="flex items-start justify-between gap-2">
    <div class="min-w-0">
      <p class="truncate text-xl font-black leading-tight text-foreground">{{ headline() }}</p>
      <p class="mt-0.5 truncate text-xs font-semibold text-muted-foreground">#{{ order.name }} · {{ orderType() }}</p>
    </div>
    <div class="flex shrink-0 items-start gap-1.5">
      <span *ngIf="showUrgencyPill" class="kds-timer" [ngClass]="urgencyPillClass()" [attr.aria-label]="minutes + ' minutos, ' + urgencyText()">
        {{ minutes }}<small>min</small>
      </span>
      <button type="button" class="kds-icon-btn" (click)="open.emit(order)" aria-label="Ver detalle" title="Detalle">⋯</button>
    </div>
  </header>

  <p *ngIf="orderNotes()" class="kds-order-note">⚠ {{ orderNotes() }}</p>

  <!-- Productos: todos visibles; un toque avanza el estado de cada uno -->
  <ul class="mt-3 space-y-1.5" aria-label="Productos del pedido">
    <li *ngFor="let it of order.items">
      <button type="button" class="kds-item" [ngClass]="'is-' + itemStateKey(it)"
        [disabled]="!allowActions || !itemAction(it) || actionPending || isItemPending(it)"
        (click)="emitItemUpdate(it)"
        [attr.aria-label]="getItemQty(it) + ' ' + getItemName(it) + (itemAction(it) ? ', tocar para marcar ' + itemActionLabel(it) : '')">
        <span class="kds-qty">{{ getItemQty(it) }}</span>
        <span class="min-w-0 flex-1">
          <span class="kds-item-name">{{ getItemName(it) }}</span>
          <span *ngIf="getItemModifiers(it)" class="block text-xs font-medium text-muted-foreground">+ {{ getItemModifiers(it) }}</span>
          <span *ngIf="getItemNotes(it)" class="kds-item-note">📝 {{ getItemNotes(it) }}</span>
        </span>
        <span class="kds-item-state">{{ isItemPending(it) ? '…' : itemStateLabel(it) }}</span>
      </button>
    </li>
    <li *ngIf="(order.items?.length ?? 0) === 0" class="py-2 text-center text-xs text-muted-foreground">Sin productos.</li>
  </ul>

  <!-- Acción principal del pedido completo -->
  <footer *ngIf="allowActions" class="mt-3">
    <button *ngIf="kitchenStage === 'NEW'" type="button" class="kds-primary bg-amber-500 hover:bg-amber-600" [disabled]="actionPending" (click)="toPreparacion.emit(order)">
      {{ actionPending ? 'Actualizando…' : 'Empezar a preparar' }}
    </button>
    <button *ngIf="kitchenStage === 'PREP'" type="button" class="kds-primary bg-emerald-600 hover:bg-emerald-700" [disabled]="actionPending" (click)="toCerrada.emit(order)">
      {{ actionPending ? 'Actualizando…' : 'Todo listo' }}
    </button>
    <button *ngIf="kitchenStage === 'READY'" type="button" class="kds-primary bg-sky-600 hover:bg-sky-700" [disabled]="actionPending" (click)="toEntregado.emit(order)">
      {{ actionPending ? 'Actualizando…' : 'Entregado' }}
    </button>
  </footer>
</article>
