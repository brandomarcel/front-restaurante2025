<article class="rounded-xl border border-primary/10 bg-white p-2.5 shadow-sm transition hover:border-primary/30 hover:shadow-md">
  <div class="flex items-start justify-between gap-2">
    <div class="min-w-0">
      <p class="truncate text-sm font-bold text-gray-900">{{ order.alias || order.name }}</p>
      <p class="truncate text-[11px] text-muted-foreground">{{ order.customer.nombre || 'Consumidor final' }}</p>
      <p class="text-[10px] text-muted-foreground">{{ order.name }}</p>
    </div>

    <span class="badge shrink-0" [ngClass]="{
      'badge-red': order.status === 'Ingresada',
      'badge-yellow': order.status === 'Preparación',
      'badge-green': order.status === 'Cerrada',
      'badge-gray': order.status !== 'Ingresada' && order.status !== 'Preparación' && order.status !== 'Cerrada'
    }">
      {{ order.status }}
    </span>
  </div>

  <div class="mt-2 grid grid-cols-3 gap-2 rounded-lg bg-slate-50 px-2 py-1.5 text-[11px] text-muted-foreground">
    <p>
      <span class="block text-[10px] font-bold uppercase text-primary">Fecha</span>
      <span class="font-semibold text-gray-700">{{ (order.createdAtISO || order.createdAt) | date:'dd/MM HH:mm' }}</span>
    </p>
    <p>
      <span class="block text-[10px] font-bold uppercase text-primary">Tipo</span>
      <span class="font-semibold text-gray-700">{{ order.type || 'Nota Venta' }}</span>
    </p>
    <p class="text-right">
      <span class="block text-[10px] font-bold uppercase text-primary">Total</span>
      <span class="font-black text-primary">{{ order.total | currency:'USD':'symbol':'1.2-2' }}</span>
    </p>
  </div>

  <div class="mt-2 flex gap-1.5">
    <button (click)="open.emit(order)" type="button" class="btn btn-outline flex-1 !py-1.5 !text-[11px]">Detalle</button>

    <button
      *ngIf="allowActions && order.status === 'Ingresada'"
      type="button"
      (click)="toPreparacion.emit(order)"
      class="btn bg-amber-500 text-white hover:bg-amber-600 !py-1.5 !text-[11px]">
      Preparación
    </button>

    <button
      *ngIf="allowActions && order.status === 'Preparación'"
      type="button"
      (click)="toCerrada.emit(order)"
      class="btn bg-emerald-600 text-white hover:bg-emerald-700 !py-1.5 !text-[11px]">
      Lista
    </button>
  </div>
</article>
