<article class="rounded-xl border border-border bg-card p-3 shadow-sm"
  [ngClass]="{ 'ring-2 ring-sky-400/50': order._flashType === 'insert' }">
  <button type="button" class="block w-full text-left" (click)="open.emit(order)">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <p class="truncate text-base font-black text-foreground">{{ order.alias || order.customer.nombre || 'Consumidor final' }}</p>
        <p class="truncate text-xs text-muted-foreground">
          #{{ order.name }}<span *ngIf="table"> · {{ table }}</span> · {{ order.type || 'Servirse' }}
        </p>
      </div>
      <span class="shrink-0 rounded-full px-2.5 py-0.5 text-[11px] font-bold" [ngClass]="stageBadge[stage]">{{ stageLabel[stage] }}</span>
    </div>

    <div class="mt-2 flex items-end justify-between">
      <span *ngIf="isActive; else hour" class="text-sm font-bold" [ngClass]="waitClass">⏱ {{ wait }}</span>
      <ng-template #hour><span class="text-xs text-muted-foreground">{{ (order.createdAtISO || order.createdAt) | date:'dd/MM HH:mm' }}</span></ng-template>
      <span class="text-lg font-black tabular-nums text-foreground">{{ order.total | currency:'USD':'symbol':'1.2-2' }}</span>
    </div>
  </button>

  <div *ngIf="allowActions" class="mt-3">
    <button *ngIf="stage === 'new'" type="button" class="h-11 w-full rounded-xl bg-amber-500 text-sm font-bold text-white active:translate-y-px" (click)="toPreparacion.emit(order)">
      Enviar a cocina
    </button>
    <button *ngIf="stage === 'prep'" type="button" class="h-11 w-full rounded-xl bg-emerald-600 text-sm font-bold text-white active:translate-y-px" (click)="toCerrada.emit(order)">
      Cerrar orden
    </button>
    <button *ngIf="stage === 'ready' || stage === 'closed'" type="button"
      class="h-11 w-full rounded-xl text-sm font-bold active:translate-y-px"
      [ngClass]="invoiced ? 'border border-border bg-card text-foreground' : 'bg-primary text-primary-foreground'"
      (click)="goOrder.emit(order)">
      {{ invoiced ? 'Ver orden' : 'Cobrar' }}
    </button>
  </div>
</article>
