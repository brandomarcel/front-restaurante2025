<article class="rounded-xl border border-border bg-card p-3 shadow-sm"
  [ngClass]="{ 'ring-2 ring-sky-400/50': order._flashType === 'insert' }">
  <button type="button" class="block w-full text-left" (click)="open.emit(order)" [attr.aria-label]="'Ver detalle de ' + headline">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <p class="truncate text-base font-black text-foreground">{{ headline }}</p>
        <p class="mt-0.5 flex flex-wrap items-center gap-1.5 text-xs text-muted-foreground">
          <span *ngIf="typeLabel" class="rounded bg-foreground px-1.5 py-px text-xs font-bold text-background">{{ typeLabel }}</span>
          <span>Orden {{ order.name }}</span>
        </p>
      </div>
      <span class="shrink-0 rounded-full px-2.5 py-0.5 text-xs font-bold" [ngClass]="stageBadge[stage]">{{ stageLabel[stage] }}</span>
    </div>

    <div class="mt-2 flex items-end justify-between">
      <span *ngIf="isActive; else hour" class="text-sm font-bold" [ngClass]="waitClass">Espera {{ wait }}</span>
      <ng-template #hour><span class="text-xs text-muted-foreground">{{ (order.createdAtISO || order.createdAt) | date:'dd/MM HH:mm' }}</span></ng-template>
      <span class="text-lg font-black tabular-nums text-foreground">{{ order.total | currency:'USD':'symbol':'1.2-2' }}</span>
    </div>
  </button>

  <div *ngIf="allowActions && stage !== 'cancelled'" class="mt-3 flex gap-2">
    <button *ngIf="isActive" type="button" class="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-border bg-card text-muted-foreground active:translate-y-px"
      (click)="printComanda.emit(order)" aria-label="Imprimir comanda" title="Imprimir comanda">
      <fa-icon [icon]="['fas', 'print']"></fa-icon>
    </button>
    <button *ngIf="kitchenEnabled && isActive" type="button" class="h-11 flex-1 rounded-xl border border-border bg-card text-sm font-bold text-foreground active:translate-y-px disabled:opacity-60"
      [disabled]="actionPending" (click)="emitNext()">
      {{ actionPending ? 'Actualizando…' : nextAction }}
    </button>
    <button type="button" class="h-11 flex-1 rounded-xl text-sm font-bold active:translate-y-px"
      [ngClass]="invoiced ? 'border border-border bg-card text-foreground' : 'bg-primary text-primary-foreground'"
      (click)="goOrder.emit(order)">
      {{ invoiced ? 'Ver orden' : 'Cobrar' }}
    </button>
  </div>
</article>
